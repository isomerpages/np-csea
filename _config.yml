title: Center for Southeast Asia
url: https://www.csea.edu.sg
favicon: /images/Favicon/logo no bg.png
colors:
  primary-color: "#000000"
  secondary-color: "#4a90e2"
  media-colors:
    - title: media-color-one
      color: "#59cbe8"
    - title: media-color-two
      color: "#9d2235"
    - title: media-color-three
      color: "#005eb8"
    - title: media-color-four
      color: "#ff7500"
    - title: media-color-five
      color: "#af1685"
description: "Broaden Your World, Boost Your Career: Intern in Southeast Asia!"
permalink: none
baseurl: ""
exclude:
  - travis-script.js
  - .travis.yml
  - README.md
  - package.json
  - package-lock.json
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - Gemfile
  - Gemfile.lock
include:
  - _redirects
defaults:
  - scope:
      path: ""
    values:
      layout: page
custom_css_path: /misc/custom.css
custom_print_css_path: /assets/css/print.css
paginate: 12
remote_theme: isomerpages/isomerpages-template@next-gen
safe: false
plugins:
  - jekyll-feed
  - jekyll-assets
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-remote-theme
staging: https://staging-lite.deswjpuc7hmt3.amplifyapp.com
prod: https://master.di7iiabooigai.amplifyapp.com
facebook-pixel: ""
shareicon: /images/Logos/CSEA_LL1_FULL_COLOUR_LIGHT_BG_CMYK.png
is_government: false
google_analytics_ga4: ""
linkedin-insights: ""
resources_name: images
